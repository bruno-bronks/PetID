events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location /health {
            proxy_pass http://api/health;
        }

        # Arquivos estáticos de upload
        location /uploads/ {
            alias /var/www/uploads/;
            access_log off;
            expires max;
            add_header Cache-Control "public, max-age=31536000";
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name 148.230.79.134;

        # Self-signed certs ou Let's Encrypt reais montados no volume
        ssl_certificate /etc/letsencrypt/live/api.petapet.pet/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.petapet.pet/privkey.pem;

        client_max_body_size 50M;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location /health {
            proxy_pass http://api/health;
        }

        # Arquivos estáticos de upload
        location /uploads/ {
            alias /var/www/uploads/;
            access_log off;
            expires max;
            add_header Cache-Control "public, max-age=31536000";
        }
    }
}

